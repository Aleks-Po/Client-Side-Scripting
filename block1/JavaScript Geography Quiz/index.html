<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JavaScript Geography Quiz</title>
	<link rel="stylesheet" href="./css/style.css">
</head>
<body>
	<main class="quiz-container">

		<h1>Geography Quiz</h1>
		<p>Answer the five questions below.</p>

		<form id="quizForm">

			<div class="question">
				<input type="text" id="answer1" placeholder="What is the capital city of Scotland?">
				<p id="result1" class="result"></p>
			</div>

			<div class="question">
				<input type="text" id="answer2" placeholder="What is the capital city of France?">
				<p id="result2" class="result"></p>
			</div>

			<div class="question">
				<input type="text" id="answer3" placeholder="Which country is famous for the pyramids at Giza?">
				<p id="result3" class="result"></p>
			</div>

			<div class="question">
				<input type="text" id="answer4" placeholder="What is the largest ocean in the world?">
				<p id="result4" class="result"></p>
			</div>

			<div class="question">
				<input type="text" id="answer5" placeholder="Which continent is Brazil in?">
				<p id="result5" class="result"></p>
			</div>

			<button type="submit">Submit Answers</button>

			<p id="finalScore"></p>
			<p id="finalResult"></p>

		</form>

  </main>


	<script src="./js/script.js"></script>
</body>
</html>
